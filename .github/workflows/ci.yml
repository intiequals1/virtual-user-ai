name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python smoke and acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run root smoke and acceptance tests
        run: python -m pytest tests

      - name: Run POC smoke tests
        run: python -m pytest product/system/poc_with_triggers/tests
